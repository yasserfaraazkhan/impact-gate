name: Bug Report
description: Report a bug in @yasserkhanorg/e2e-agents
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the fields below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Run `e2e-ai-agents crew --workflow quick-check`
        2. Wait for analysis to complete
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen.
      placeholder: Describe what you expected...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened.
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v20.11.0"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Your OS and version.
      placeholder: "macOS 15.3 / Ubuntu 22.04 / Windows 11"
    validations:
      required: false

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Output of `npx e2e-ai-agents --version` or the version in your package.json.
      placeholder: "1.8.5"
    validations:
      required: false

  - type: dropdown
    id: llm-provider
    attributes:
      label: LLM Provider
      description: Which LLM provider were you using?
      options:
        - Anthropic
        - OpenAI
        - Ollama
        - Custom
        - N/A
    validations:
      required: false

  - type: input
    id: command
    attributes:
      label: Command used
      description: The full command you ran.
      placeholder: "e2e-ai-agents crew --workflow quick-check"
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Config file
      description: Paste your config file contents (sensitive values redacted).
      render: yaml
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant log output.
      render: shell
    validations:
      required: false
