# Lightweight PR impact-analysis workflow (single-job, no sharding).
#
# For a sharded, reusable template with artifact-based deduplication,
# see e2e-tests-playwright-template.yml in this directory.
#
# API-outage behaviour (fail-open):
#   If the plan step fails and produces no plan.json the workflow
#   falls back to the full test suite with a warning annotation.

name: e2e-impact-plan

on:
  pull_request:
    paths:
      - 'webapp/**'
      - 'e2e-tests/**'

jobs:
  recommend-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build recommendation
        id: plan
        continue-on-error: true
        run: |
          npx impact-gate suggest \
            --path ./webapp \
            --tests-root ./e2e-tests/playwright \
            --since origin/master \
            --github-output "$GITHUB_OUTPUT" \
            --ci-comment-path .e2e-ai-agents/pr-comment.md

      # ── Fail-open gate ──────────────────────────────────────
      # If the plan step failed AND produced no plan.json, fall
      # back to the full test suite instead of blocking the PR.
      - name: Fail-open gate
        id: gate
        run: |
          if [ "${{ steps.plan.outcome }}" != "success" ]; then
            if [ ! -f ./e2e-tests/playwright/.e2e-ai-agents/plan.json ]; then
              echo "::warning::Impact analysis unavailable — running full test suite as fallback."
              echo "run_set=full" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Impact plan produced output but failed enforcement."
            exit 1
          fi
          echo "run_set=${{ steps.plan.outputs.run_set }}" >> "$GITHUB_OUTPUT"

      - name: Run targeted tests
        if: steps.gate.outputs.run_set == 'targeted'
        run: |
          mkdir -p ./.e2e-ai-agents
          node -e "const fs=require('fs'); const plan=JSON.parse(fs.readFileSync('./e2e-tests/playwright/.e2e-ai-agents/plan.json','utf8')); const tests=plan.recommendedTests.map((t)=>t.replace(/ \(flags:.*\)$/, '')); fs.writeFileSync('/tmp/recommended-tests.txt', tests.join('\n'));"
          if [ -s /tmp/recommended-tests.txt ]; then
            TEST_ARGS=$(tr '\n' ' ' < /tmp/recommended-tests.txt)
            npx playwright test $TEST_ARGS --reporter=json > ./.e2e-ai-agents/playwright-report.json
          else
            echo "No recommended targeted tests; running smoke fallback"
            npx playwright test --grep @smoke --reporter=json > ./.e2e-ai-agents/playwright-report.json
          fi

      - name: Run smoke tests
        if: steps.gate.outputs.run_set == 'smoke'
        run: |
          mkdir -p ./.e2e-ai-agents
          npx playwright test --grep @smoke --reporter=json > ./.e2e-ai-agents/playwright-report.json

      - name: Run full tests
        if: steps.gate.outputs.run_set == 'full'
        run: |
          mkdir -p ./.e2e-ai-agents
          npx playwright test --reporter=json > ./.e2e-ai-agents/playwright-report.json

      - name: Build traceability input (optional)
        if: always()
        run: |
          if [ -f ./.e2e-ai-agents/playwright-report.json ]; then
            npx impact-gate traceability-capture \
              --path ./webapp \
              --tests-root ./e2e-tests/playwright \
              --traceability-report ./.e2e-ai-agents/playwright-report.json \
              --since origin/master
          else
            echo "No Playwright JSON report found; skipping traceability capture."
          fi

      - name: Update traceability manifest (optional)
        if: always()
        run: |
          if [ -f ./e2e-tests/playwright/.e2e-ai-agents/traceability-input.json ]; then
            npx impact-gate traceability-ingest \
              --path ./webapp \
              --tests-root ./e2e-tests/playwright \
              --traceability-input ./e2e-tests/playwright/.e2e-ai-agents/traceability-input.json \
              --traceability-min-hits 2
          else
            echo "No traceability input file found; skipping ingest."
          fi

      - name: PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './.e2e-ai-agents/pr-comment.md';
            if (!fs.existsSync(path)) {
              console.log('No PR comment file found; skipping.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
