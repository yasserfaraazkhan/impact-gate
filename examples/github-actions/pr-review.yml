# PR review workflow: impact analysis + defect prediction in one comment.
#
# Posts a single PR comment with:
#   - Impacted user flows with coverage status
#   - Coverage gaps that need tests
#   - Defect risk score and top factors
#   - Merge decision (safe / review / must-add-tests)
#
# Requires a route-families.json manifest for accurate flow mapping.
# Without it, falls back to heuristic directory-based grouping.
#
# Cost: $0.00 (deterministic). Add --deep for LLM analysis (~$0.02/PR).

name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run impact-gate review
        id: review
        continue-on-error: true
        run: |
          npx impact-gate review \
            --path . \
            --since origin/${{ github.base_ref }} \
            --ci-comment-path .e2e-ai-agents/pr-comment.md \
            --json > .e2e-ai-agents/review.json 2> .e2e-ai-agents/review.log || true

      # Optional: defect risk gate (uncomment to block merges above threshold)
      # - name: Defect risk gate
      #   run: |
      #     npx impact-gate predict \
      #       --path . \
      #       --since origin/${{ github.base_ref }} \
      #       --predict-threshold 0.8

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentPath = '.e2e-ai-agents/pr-comment.md';
            if (!fs.existsSync(commentPath)) {
              console.log('No review comment file found; skipping.');
              return;
            }
            const body = fs.readFileSync(commentPath, 'utf8');

            // Find and update existing impact-gate comment, or create new one
            const marker = 'Generated by [impact-gate]';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Created new PR comment');
            }
